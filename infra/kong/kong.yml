_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: user-routes
        paths:
          - /api/v1/users
          - /api/v1/auth
        strip_path: false

  - name: product-service
    url: http://product-service:8082
    routes:
      - name: product-routes
        paths:
          - /api/v1/products
        strip_path: false

  - name: cart-service
    url: http://cart-service:8083
    routes:
      - name: cart-routes
        paths:
          - /api/v1/cart
        strip_path: false

  - name: order-service
    url: http://order-service:8084
    routes:
      - name: order-routes
        paths:
          - /api/v1/orders
        strip_path: false

  - name: payment-service
    url: http://payment-service:8085
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false

  - name: notification-service
    url: http://notification-service:8086
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 120
      hour: 5000
      policy: local
      hide_client_headers: false
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Authorization", "Content-Type", "X-Correlation-Id"]
      exposed_headers: ["X-RateLimit-Remaining", "X-Correlation-Id"]
      credentials: true
      max_age: 3600
