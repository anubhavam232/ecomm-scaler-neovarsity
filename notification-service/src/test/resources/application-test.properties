# Test Configuration for Notification Service

# Application Name
spring.application.name=notification-service-test

# Kafka Configuration for Testing
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# AWS SES Configuration (Mock values for testing)
aws.ses.region=us-east-1
aws.ses.from-email=noreply@test.example.com

# Logging Configuration
logging.level.root=INFO
logging.level.com.ecommerce.notification=DEBUG

# Disable cloud config for tests
spring.cloud.config.enabled=false
